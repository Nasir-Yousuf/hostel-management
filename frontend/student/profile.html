<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | NIYD Hostel Student Portal</title>
  
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/student.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

  <header class="student-navbar">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; height: 68px;">
      <a href="index.html" class="brand-logo" style="gap: var(--space-2);">
        <div class="brand-emblem" style="width: 38px; height: 38px; font-size: 0.9rem;">NIYD</div>
        <div>
          <span style="font-weight: 700; color: var(--color-navy); font-size: 0.95rem;">Student Residential Portal</span>
        </div>
      </a>
      <button type="button" class="btn btn-outline btn-sm" onclick="Auth.logout()">Sign Out</button>
    </div>

    <div style="background: #F8FAFC; border-top: 1px solid var(--color-border-light);">
      <div class="container student-nav-menu">
        <a href="index.html" class="student-nav-link"><span>🏠</span> Dashboard</a>
        <a href="room.html" class="student-nav-link"><span>🛏️</span> My Room</a>
        <a href="fees.html" class="student-nav-link"><span>💳</span> Fees & Invoices</a>
        <a href="maintenance.html" class="student-nav-link"><span>🔧</span> Maintenance Requests</a>
        <a href="rules.html" class="student-nav-link"><span>📜</span> Hostel Rules</a>
        <a href="announcements.html" class="student-nav-link"><span>📢</span> Notices</a>
        <a href="contact.html" class="student-nav-link"><span>📞</span> Contact Warden</a>
        <a href="profile.html" class="student-nav-link active"><span>👤</span> Profile</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: var(--space-8); padding-bottom: var(--space-12); max-width: 860px;">
    
    <!-- Profile Card -->
    <div class="card" style="margin-bottom: var(--space-6);">
      <div class="card-header">
        <h2 class="card-title">Residential Student Profile</h2>
        <span class="badge badge-success">Verified Resident</span>
      </div>
      <div class="card-body" id="studentProfileDetails">
        <span class="spinner"></span>
      </div>
    </div>

    <!-- Security & Password Change Card -->
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Change Account Password</h3>
      </div>
      <form id="changePasswordForm">
        <div class="card-body">
          <div class="form-group">
            <label class="form-label">Current Password <span class="required">*</span></label>
            <input type="password" id="currentPass" class="form-control" required>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
            <div class="form-group">
              <label class="form-label">New Password <span class="required">*</span></label>
              <input type="password" id="newPass" class="form-control" required minlength="6">
            </div>
            <div class="form-group">
              <label class="form-label">Confirm New Password <span class="required">*</span></label>
              <input type="password" id="confirmPass" class="form-control" required minlength="6">
            </div>
          </div>
        </div>
        <div class="card-footer">
          <button type="submit" class="btn btn-primary" id="savePassBtn">Update Password</button>
        </div>
      </form>
    </div>

  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/student/profile.js"></script>
</body>
</html>
