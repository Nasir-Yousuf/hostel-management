<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notices & Circulars | NIYD Hostel Student Portal</title>
  
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/student.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

  <header class="student-navbar">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; height: 68px;">
      <a href="index.html" class="brand-logo" style="gap: var(--space-2);">
        <div class="brand-emblem" style="width: 38px; height: 38px; font-size: 0.9rem;">NIYD</div>
        <div>
          <span style="font-weight: 700; color: var(--color-navy); font-size: 0.95rem;">Student Residential Portal</span>
        </div>
      </a>
      <button type="button" class="btn btn-outline btn-sm" onclick="Auth.logout()">Sign Out</button>
    </div>

    <div style="background: #F8FAFC; border-top: 1px solid var(--color-border-light);">
      <div class="container student-nav-menu">
        <a href="index.html" class="student-nav-link"><span>🏠</span> Dashboard</a>
        <a href="room.html" class="student-nav-link"><span>🛏️</span> My Room</a>
        <a href="fees.html" class="student-nav-link"><span>💳</span> Fees & Invoices</a>
        <a href="maintenance.html" class="student-nav-link"><span>🔧</span> Maintenance Requests</a>
        <a href="rules.html" class="student-nav-link"><span>📜</span> Hostel Rules</a>
        <a href="announcements.html" class="student-nav-link active"><span>📢</span> Notices</a>
        <a href="contact.html" class="student-nav-link"><span>📞</span> Contact Warden</a>
        <a href="profile.html" class="student-nav-link"><span>👤</span> Profile</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: var(--space-8); padding-bottom: var(--space-12); max-width: 860px;">
    <h2 style="color: var(--color-navy); font-size: 1.5rem; margin-bottom: var(--space-6);">Official Hostel Notices & Circulars</h2>

    <div id="studentAnnouncementsList" style="display: flex; flex-direction: column; gap: var(--space-4);">
      <div style="text-align: center; padding: 3rem;"><span class="spinner"></span></div>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/mock-db.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.requireAuth([CONFIG.ROLES.STUDENT])) return;
      const container = document.getElementById('studentAnnouncementsList');

      try {
        const res = await API.get('/announcements');
        const items = res.data || res || [];

        if (!items.length) {
          container.innerHTML = `<div style="text-align: center; color: var(--color-text-secondary); padding: 3rem;">No circulars currently posted.</div>`;
          return;
        }

        container.innerHTML = items.map((ann) => {
          const priorityClass = ann.priority === 'urgent' ? 'badge-danger' : ann.priority === 'important' ? 'badge-warning' : 'badge-neutral';
          return `
            <div class="card" style="padding: var(--space-5);">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <div style="display: flex; gap: var(--space-2); align-items: center;">
                  <span class="badge ${priorityClass}">${ann.priority}</span>
                  <span class="badge badge-neutral" style="text-transform: capitalize;">${ann.category}</span>
                  ${ann.isPinned ? `<span class="badge badge-gold">📌 Pinned</span>` : ''}
                </div>
                <span style="font-size: var(--font-size-xs); color: var(--color-text-muted);">${Utils.formatDate(ann.publishedAt)}</span>
              </div>
              <h3 style="color: var(--color-navy); font-size: 1.15rem; margin-bottom: 6px;">${Utils.escapeHtml(ann.title)}</h3>
              ${ann.titleBn ? `<div style="font-size: 0.88rem; color: var(--color-primary-dark); margin-bottom: 8px;">${Utils.escapeHtml(ann.titleBn)}</div>` : ''}
              <p style="font-size: var(--font-size-sm); color: var(--color-text); margin-bottom: 4px;">${Utils.escapeHtml(ann.content)}</p>
              ${ann.contentBn ? `<p style="font-size: var(--font-size-sm); color: var(--color-text-secondary); border-top: 1px dashed var(--color-border-light); padding-top: 4px;">${Utils.escapeHtml(ann.contentBn)}</p>` : ''}
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div style="color: var(--color-danger); text-align: center;">Failed to load announcements.</div>`;
      }
    });
  </script>
</body>
</html>
